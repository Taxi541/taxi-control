<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Aceite de Corrida</title>

<style>

body{
    margin:0;
    background:#f4f6f9;
    font-family:Arial, Helvetica, sans-serif;
}

.container{
    max-width:420px;
    margin:40px auto;
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 0 15px rgba(0,0,0,.15);
}

h1{
    text-align:center;
    color:#0078D4;
}

.info{
    margin-top:25px;
    font-size:18px;
}

.info p{
    margin:15px 0;
}

button{
    width:100%;
    padding:18px;
    border:none;
    border-radius:10px;
    background:#28a745;
    color:white;
    font-size:20px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    opacity:0.9;
}

button:disabled{
    background:#6c757d;
    cursor:not-allowed;
}

#resultado{
    margin-top:25px;
    background:#f2f2f2;
    padding:15px;
    border-radius:10px;
    display:none;
}

</style>

</head>

<body>

<div class="container">

<h1>🚖 Aceite de Corrida</h1>

<div class="info">

<p><strong>Corrida:</strong> <span id="corrida"></span></p>

<p><strong>Origem:</strong> <span id="origem"></span></p>

<p><strong>Destino:</strong> <span id="destino"></span></p>

<p><strong>Motorista:</strong> <span id="motorista"></span></p>

</div>

<button id="botaoCorrida" onclick="aceitar()">

✅ ACEITAR CORRIDA

</button>

<div id="resultado"></div>

</div>

<script>

const parametros = new URLSearchParams(window.location.search);

document.getElementById("corrida").innerText =
parametros.get("corrida") || "Não informado";

document.getElementById("origem").innerText =
parametros.get("origem") || "Não informado";

document.getElementById("destino").innerText =
parametros.get("destino") || "Não informado";

document.getElementById("motorista").innerText =
parametros.get("motorista") || "Não informado";


function aceitar(){

    let data = new Date();

    document.getElementById("resultado").style.display="block";

    document.getElementById("resultado").innerHTML =
        "<b>✔️ Corrida aceita!</b><br><br>" +
        "🕒 " + data.toLocaleString();

    const botao = document.getElementById("botaoCorrida");

    botao.innerHTML = "🚖 INICIAR CORRIDA";
    botao.style.background = "#0078D4";
    botao.onclick = iniciarCorrida;

}


function iniciarCorrida(){

    let data = new Date();

    document.getElementById("resultado").innerHTML =
        "<b>🚖 Corrida iniciada!</b><br><br>" +
        "🕒 " + data.toLocaleString();

    const botao = document.getElementById("botaoCorrida");

    botao.innerHTML = "🏁 FINALIZAR CORRIDA";
    botao.style.background = "#dc3545";
    botao.onclick = finalizarCorrida;

}


function finalizarCorrida(){

    let data = new Date();

    document.getElementById("resultado").innerHTML =
        "<b>🏁 Corrida finalizada!</b><br><br>" +
        "🕒 " + data.toLocaleString();

    const botao = document.getElementById("botaoCorrida");

    botao.disabled = true;
    botao.innerHTML = "✅ CORRIDA FINALIZADA";

}

</script>

</body>

</html>
