<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Aceite de Corrida</title>

<style>

body{
    margin:0;
    background:#f4f6f9;
    font-family:Arial, Helvetica, sans-serif;
}

.container{
    max-width:420px;
    margin:40px auto;
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 0 15px rgba(0,0,0,.15);
}

h1{
    text-align:center;
    color:#0078D4;
}

.info{
    margin-top:25px;
    font-size:18px;
}

.info p{
    margin:15px 0;
}

button{

    width:100%;
    padding:18px;
    border:none;
    border-radius:10px;
    background:#28a745;
    color:white;
    font-size:20px;
    cursor:pointer;

}

button:hover{

    background:#218838;

}

#resultado{

    margin-top:25px;
    background:#f2f2f2;
    padding:15px;
    border-radius:10px;
    display:none;

}

</style>

</head>

<body>

<div class="container">

<h1>🚖 Aceite de Corrida</h1>

<div class="info">

<p><strong>Corrida:</strong> 0001</p>

<p><strong>Origem:</strong> Empresa</p>

<p><strong>Destino:</strong> Hospital</p>

<p><strong>Motorista:</strong> João</p>

</div>

<button onclick="aceitar()">

✅ ACEITAR CORRIDA

</button>

<div id="resultado"></div>

</div>

<script>

function aceitar(){

if(navigator.geolocation){

navigator.geolocation.getCurrentPosition(function(posicao){

let data = new Date();

document.getElementById("resultado").style.display="block";

document.getElementById("resultado").innerHTML=

"<b>✔️ Corrida aceita!</b><br><br>"+
"🕒 "+data.toLocaleString()+"<br><br>"+
"📍 Latitude: "+posicao.coords.latitude+
"<br><br>"+
"📍 Longitude: "+posicao.coords.longitude;

});

}else{

alert("Seu navegador não suporta localização.");

}

}

</script>

</body>

</html>
